---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flightdynamics-placeholder
  namespace: cs-tools
  labels:
    app: flightdynamics-placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flightdynamics-placeholder
  template:
    metadata:
      labels:
        app: flightdynamics-placeholder
    spec:
      containers:
        - name: flightdynamics-placeholder
          image: ghcr.io/manganoconsulting/flightdynamics-placeholder:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: flightdynamics-placeholder
  namespace: cs-tools
  labels:
    app: flightdynamics-placeholder
spec:
  selector:
    app: flightdynamics-placeholder
  ports:
    - name: http
      port: 80
      targetPort: 80
